openapi: 3.1.0
info:
    title: CV App
    description: |-
        This is a server-side RESTful API for the **CV App**, built on the OpenAPI 3.1.0 specification.
        More information about interactive documentation can be found on [Swagger](https://swagger.io/).

        This project is designed to create and manage a database of users' CVs. It supports rich models for describing work experience, programming skills, language proficiency, and scientific interests. Thanks to strict typing and validation (via Pydantic), data can be easily serialized for storage in the database, including handling MongoDB ObjectIds. You can test all available endpoints and interact with the API directly in this interface.

        Some useful links:
        - [Production application server](https://api-cv-app-max-damir.onrender.com/)
        - [Official FastAPI documentation](https://fastapi.tiangolo.com/)
        - [OpenAPI 3.1.0 specification](https://spec.openapis.org/oas/v3.1.0.html)
    contact:
        name: Support Team
        email: maks.damir.itshi251@gmail.com
    version: 0.1.0
servers:
    - url: https://api-cv-app-max-damir.onrender.com/
      description: Production server (Render)
tags:
    - name: root
      description: Check server status
    - name: users-cvs
      description: Operations on users' CVs (CRUD)
paths:
    /:
        get:
            tags:
                - root
            summary: Root
            operationId: root__get
            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            example:
                                status: ok
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"
    /api/v1/users-cvs/{user_id}:
        get:
            tags:
                - users-cvs
            summary: Get User Cv
            operationId: get_user_cv_api_v1_users_cvs__user_id__get
            parameters:
                - name: user_id
                  in: path
                  required: true
                  schema:
                      type: string
                      title: User Id
            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/UserCVResponse"

                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: 1 is not a valid ObjectId, it must be a 12-byte input or a 24-character hex string

                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: CV not found.
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: Internal Server Error.
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"
        patch:
            tags:
                - users-cvs
            summary: Update User Cv
            operationId: update_user_cv_api_v1_users_cvs__user_id__patch
            parameters:
                - name: user_id
                  in: path
                  required: true
                  schema:
                      type: string
                      title: User Id
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            additionalProperties: true
                            title: Fields To Update
                        example:
                            personal_info:
                                last_name: Peterson
                                preferred_name: John

            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                                title: Response Update User Cv Api V1 Users Cvs  User Id  Put
                            example:
                                id: 507f1f77bcf86cd799439011
                                status: updated
                                updated_fields:
                                    personal_info:
                                        last_name: Peterson
                                        preferred_name: John

                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: 1 is not a valid ObjectId, it must be a 12-byte input or a 24-character hex string

                "422":
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/HTTPValidationError"
                                    - $ref: "#/components/schemas/UpdateValidationErrorResponse"
                            example:
                                detail:
                                    message: Some fields are not valid update paths.
                                    invalid_fields:
                                        ["house_number", "relatives"]
                                    allowed_fields:
                                        [
                                            "photo",
                                            "personal_info.first_name",
                                            "personal_info.last_name",
                                            "personal_info.preferred_name",
                                            "personal_info.email",
                                            "personal_info.phone",
                                            "personal_info.date_of_birth",
                                            "personal_info.nationality",
                                            "personal_info.country_of_residence",
                                            "personal_info.gender",
                                            "languages",
                                            "work_experience",
                                            "scientific_interests",
                                            "publications",
                                            "awards",
                                            "favorite_subjects_in_school",
                                            "programming_skills",
                                            "device_access.weekly_hours",
                                            "hobbies",
                                        ]
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"

        put:
            tags:
                - users-cvs
            summary: Update User Cv
            operationId: update_user_cv_api_v1_users_cvs__user_id__put
            parameters:
                - name: user_id
                  in: path
                  required: true
                  schema:
                      type: string
                      title: User Id
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserCVRequest"

            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties: true
                                title: Response Update User Cv Api V1 Users Cvs  User Id  Put


                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: 1 is not a valid ObjectId, it must be a 12-byte input or a 24-character hex string

                "422":
                    description: Validation Error
                    content:
                        application/json:
                            schema:
                                oneOf:
                                    - $ref: "#/components/schemas/HTTPValidationError"
                                    - $ref: "#/components/schemas/UpdateValidationErrorResponse"
                            example:
                                detail:
                                    message: New document is not valid.
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"

        delete:
            tags:
                - users-cvs
            summary: Delete User Cv
            operationId: delete_user_cv_api_v1_users_cvs__user_id__delete
            parameters:
                - name: user_id
                  in: path
                  required: true
                  schema:
                      type: string
                      title: User Id
            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    type: string
                                title: Response Delete User Cv Api V1 Users Cvs  User Id  Delete
                            example:
                                id: 507f1f77bcf86cd799439011
                                status: deleted
                "400":
                    description: Bad Request
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: 1 is not a valid ObjectId, it must be a 12-byte input or a 24-character hex string
                "404":
                    description: Not Found
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: CV not found.
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: Internal Server Error.
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"

    /api/v1/users-cvs:
        get:
            tags:
                - users-cvs
            summary: Get All User Cvs
            operationId: get_all_user_cvs_api_v1_users_cvs_get
            parameters:
                - name: skip
                  in: query
                  required: false
                  schema:
                      type: integer
                      default: 0
                      title: Skip
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      maximum: 100
                      default: 10
                      title: Limit
            responses:
                "200":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    anyOf:
                                        - type: integer
                                        - type: array
                                          items:
                                              type: object
                                              additionalProperties: true
                                title: Response Get All User Cvs Api V1 Users Cvs Get
                            example:
                                total: 0
                                skip: 0
                                limit: 10
                                items: []
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 20 per 1 minute"
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: Internal Server Error.
        post:
            tags:
                - users-cvs
            summary: Create User Cv
            operationId: create_user_cv_api_v1_users_cvs_post
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UserCVRequest"

            responses:
                "201":
                    description: Successful Response
                    content:
                        application/json:
                            schema:
                                type: object
                                additionalProperties:
                                    type: string
                                title: Response Create User Cv Api V1 Users Cvs Post
                            example:
                                id: 507f1f77bcf86cd799439011
                                status: created
                "500":
                    description: Internal Server Error
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/APIErrorResponse"
                            example:
                                detail: Internal Server Error.
                "429":
                    description: Too Many Requests
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/RateLimitErrorResponse"
                            example:
                                error: "Rate limit exceeded: 30 per 1 minute"
components:
    schemas:
        RateLimitErrorResponse:
            properties:
                error:
                    type: string
                    title: Error
            additionalProperties: false
            type: object
            required:
                - error
            title: RateLimitErrorResponse
        APIErrorResponse:
            properties:
                detail:
                    type: string
                    title: Detail
            additionalProperties: false
            type: object
            required:
                - detail
            title: APIErrorResponse
        UpdateValidationErrorResponse:
            properties:
                detail:
                    properties:
                        message:
                            type: string
                            title: Message
                        invalid_fields:
                            items:
                                type: string
                            type: array
                            title: Invalid Fields
                        allowed_fields:
                            items:
                                type: string
                            type: array
                            title: Allowed Fields
                    additionalProperties: false
                    type: object
                    required:
                        - message
                    title: Update Validation Error
            additionalProperties: false
            type: object
            required:
                - detail
            title: UpdateValidationErrorResponse
        Award:
            properties:
                title:
                    type: string
                    maxLength: 100
                    minLength: 1
                    title: Title
                    example: "Best Research Paper Award"
                organization:
                    anyOf:
                        - type: string
                          maxLength: 100
                        - type: "null"
                    title: Organization
                    example: "International Conference on AI"
                date:
                    anyOf:
                        - type: string
                          format: date
                        - type: "null"
                    title: Date
                    example: "2022-11-15"
                description:
                    anyOf:
                        - type: string
                          maxLength: 300
                          minLength: 10
                        - type: "null"
                    title: Description
                    example: "Awarded for outstanding contribution to the field of artificial intelligence."
            additionalProperties: false
            type: object
            required:
                - title
            title: Award
        DeviceAccess:
            properties:
                weekly_hours:
                    type: number
                    minimum: 0
                    title: Weekly Hours
                    example: 10
            additionalProperties: false
            type: object
            required:
                - weekly_hours
            title: DeviceAccess
        Gender:
            type: string
            enum:
                - male
                - female
                - other
            title: Gender
            example: male
        HTTPValidationError:
            properties:
                detail:
                    items:
                        $ref: "#/components/schemas/ValidationError"
                    type: array
                    title: Detail
            type: object
            title: HTTPValidationError
        Hobby:
            properties:
                name:
                    type: string
                    maxLength: 50
                    minLength: 1
                    title: Name
                    example: "Reading"
            additionalProperties: false
            type: object
            required:
                - name
            title: Hobby
        Job:
            properties:
                job_title:
                    type: string
                    maxLength: 50
                    minLength: 1
                    title: Job Title
                    example: Software Engineer
                location:
                    type: string
                    maxLength: 50
                    minLength: 1
                    title: Location
                    example: New York, USA
                company:
                    type: string
                    maxLength: 50
                    minLength: 1
                    title: Company
                    example: TechCorp Inc.
                from_date:
                    type: string
                    format: date
                    title: From Date
                    example: "2020-01-01"
                to_date:
                    anyOf:
                        - type: string
                          format: date
                        - type: "null"
                    title: To Date
                    example: "2022-12-31"
                description:
                    anyOf:
                        - type: string
                          maxLength: 300
                          minLength: 10
                        - type: "null"
                    title: Description
                    example: "Responsible for developing and maintaining software applications."
            additionalProperties: false
            type: object
            required:
                - job_title
                - location
                - company
                - from_date
            title: Job
        Language:
            properties:
                name:
                    type: string
                    maxLength: 30
                    minLength: 1
                    title: Name
                    example: English
                proficiency:
                    $ref: "#/components/schemas/ProficiencyLevel"
            additionalProperties: false
            type: object
            required:
                - name
                - proficiency
            title: Language
        ProficiencyLevel:
            type: string
            enum:
                - beginner
                - elementary
                - intermediate
                - upper_intermediate
                - advanced
                - native
            title: ProficiencyLevel
            example: native
        ProgrammingLevel:
            type: string
            enum:
                - beginner
                - intermediate
                - advanced
                - expert
            title: ProgrammingLevel
            example: expert
        ProgrammingSkill:
            properties:
                language:
                    type: string
                    maxLength: 50
                    minLength: 1
                    title: Language
                    example: Python
                level:
                    $ref: "#/components/schemas/ProgrammingLevel"
            additionalProperties: false
            type: object
            required:
                - language
                - level
            title: ProgrammingSkill
        Publication:
            properties:
                title:
                    type: string
                    maxLength: 200
                    minLength: 1
                    title: Title
                    example: "A Comprehensive Study on Quantum Computing"
                journal:
                    anyOf:
                        - type: string
                          maxLength: 100
                        - type: "null"
                    title: Journal
                    example: "Journal of Quantum Research"
                publication_date:
                    anyOf:
                        - type: string
                          format: date
                        - type: "null"
                    title: Publication Date
                    example: "2023-05-15"
                authors:
                    items:
                        type: string
                    type: array
                    title: Authors
                    example: ["John Doe", "Jane Smith"]
                url:
                    anyOf:
                        - type: string
                        - type: "null"
                    title: Url
                    example: "https://example.com/publication"
            additionalProperties: false
            type: object
            required:
                - title
            title: Publication
        SchoolSubject:
            type: string
            enum:
                - mathematics
                - physics
                - chemistry
                - biology
                - computer_science
                - history
                - geography
                - literature
                - english
                - other
            title: SchoolSubject
            example: mathematics
        ScientificInterest:
            properties:
                name:
                    type: string
                    maxLength: 100
                    minLength: 1
                    title: Name
                    example: "Quantum Mechanics"
                description:
                    anyOf:
                        - type: string
                          maxLength: 300
                          minLength: 10
                        - type: "null"
                    title: Description
                    example: "The study of the behavior of matter and energy at the atomic and subatomic levels."
            additionalProperties: false
            type: object
            required:
                - name
            title: ScientificInterest
        UserCVRequest:
            properties:
                photo:
                    anyOf:
                        - type: string
                          example: null
                        - type: "null"
                    title: Photo
                personal_info:
                    $ref: "#/components/schemas/UserPersonalInfo"
                languages:
                    items:
                        $ref: "#/components/schemas/Language"
                    type: array
                    title: Languages
                work_experience:
                    items:
                        $ref: "#/components/schemas/Job"
                    type: array
                    title: Work Experience
                scientific_interests:
                    items:
                        $ref: "#/components/schemas/ScientificInterest"
                    type: array
                    title: Scientific Interests
                publications:
                    items:
                        $ref: "#/components/schemas/Publication"
                    type: array
                    title: Publications
                awards:
                    items:
                        $ref: "#/components/schemas/Award"
                    type: array
                    title: Awards
                favorite_subjects_in_school:
                    items:
                        $ref: "#/components/schemas/SchoolSubject"
                    type: array
                    title: Favorite Subjects In School
                programming_skills:
                    items:
                        $ref: "#/components/schemas/ProgrammingSkill"
                    type: array
                    title: Programming Skills
                device_access:
                    $ref: "#/components/schemas/DeviceAccess"
                hobbies:
                    items:
                        $ref: "#/components/schemas/Hobby"
                    type: array
                    title: Hobbies
            additionalProperties: false
            type: object
            required:
                - personal_info
                - languages
                - work_experience
                - scientific_interests
                - publications
                - awards
                - favorite_subjects_in_school
                - programming_skills
                - device_access
                - hobbies
            title: UserCVRequest
        UserCVResponse:
            properties:
                id:
                    anyOf:
                        - type: string
                          example: 507f1f77bcf86cd799439011
                        - type: "null"

                    title: Id
                photo:
                    anyOf:
                        - type: string
                          example: null
                        - type: "null"
                    title: Photo
                personal_info:
                    $ref: "#/components/schemas/UserPersonalInfo"
                languages:
                    items:
                        $ref: "#/components/schemas/Language"
                    type: array
                    title: Languages
                work_experience:
                    items:
                        $ref: "#/components/schemas/Job"
                    type: array
                    title: Work Experience
                scientific_interests:
                    items:
                        $ref: "#/components/schemas/ScientificInterest"
                    type: array
                    title: Scientific Interests
                publications:
                    items:
                        $ref: "#/components/schemas/Publication"
                    type: array
                    title: Publications
                awards:
                    items:
                        $ref: "#/components/schemas/Award"
                    type: array
                    title: Awards
                favorite_subjects_in_school:
                    items:
                        $ref: "#/components/schemas/SchoolSubject"
                    type: array
                    title: Favorite Subjects In School
                programming_skills:
                    items:
                        $ref: "#/components/schemas/ProgrammingSkill"
                    type: array
                    title: Programming Skills
                device_access:
                    $ref: "#/components/schemas/DeviceAccess"
                hobbies:
                    items:
                        $ref: "#/components/schemas/Hobby"
                    type: array
                    title: Hobbies
            additionalProperties: false
            type: object
            required:
                - personal_info
                - languages
                - work_experience
                - scientific_interests
                - publications
                - awards
                - favorite_subjects_in_school
                - programming_skills
                - device_access
                - hobbies
            title: UserCVResponse
        UserPersonalInfo:
            properties:
                first_name:
                    type: string
                    maxLength: 20
                    minLength: 1
                    title: First Name
                    example: John
                last_name:
                    type: string
                    maxLength: 20
                    minLength: 1
                    title: Last Name
                    example: Peterson
                preferred_name:
                    anyOf:
                        - type: string
                          maxLength: 20
                          minLength: 1
                        - type: "null"
                    title: Preferred Name
                    example: Johnny
                email:
                    type: string
                    format: email
                    title: Email
                    example: example@example.com
                phone:
                    type: string
                    maxLength: 15
                    minLength: 10
                    title: Phone
                    example: "+1234567890"
                date_of_birth:
                    type: string
                    format: date
                    title: Date Of Birth
                    example: "1990-01-01"
                nationality:
                    type: string
                    maxLength: 20
                    minLength: 1
                    title: Nationality
                    example: American
                country_of_residence:
                    type: string
                    maxLength: 30
                    minLength: 1
                    title: Country Of Residence
                    example: United States
                gender:
                    $ref: "#/components/schemas/Gender"
            additionalProperties: false
            type: object
            required:
                - first_name
                - last_name
                - email
                - phone
                - date_of_birth
                - nationality
                - country_of_residence
                - gender
            title: UserPersonalInfo
        ValidationError:
            properties:
                loc:
                    items:
                        anyOf:
                            - type: string
                            - type: integer
                    type: array
                    title: Location
                msg:
                    type: string
                    title: Message
                type:
                    type: string
                    title: Error Type
                input:
                    title: Input
                ctx:
                    type: object
                    title: Context
            type: object
            required:
                - loc
                - msg
                - type
            title: ValidationError
